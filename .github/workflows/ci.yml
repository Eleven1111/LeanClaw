name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ANTHROPIC_API_KEY: ""
  LEANCLAW_WEB_MOCK: "1"

jobs:
  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runner contract
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('CI requires macOS arm64')"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: Static governance checks
        run: npm run check:static

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migration evidence
        run: npm run migration:evidence

      - name: Production build
        run: npm run build

  electron-e2e:
    name: Electron E2E
    needs: quality
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runner contract
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('CI requires macOS arm64')"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: Production build
        run: npm run build

      - name: Electron E2E
        run: npm run e2e
